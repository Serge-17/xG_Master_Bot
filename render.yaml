# render.yaml — деплой на Render в режиме Webhook (Web Service)
#
# Тип "web" — правильный для webhook-режима.
# Render назначает публичный HTTPS-URL → указываем его в WEBHOOK_URL.
# Никакого polling → никакого Conflict при деплое.

services:
  - type: web
    name: xg-master-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn webapp:app --host 0.0.0.0 --port ${PORT:-10000}
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FOOTBALL_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: PORT
        value: "10000"
      # ВАЖНО: замени на свой реальный URL из Render dashboard
      - key: WEBHOOK_URL
        value: "https://xg-master-bot.onrender.com"
