services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xg_master_bot
      POSTGRES_USER: xg_master
      POSTGRES_PASSWORD: xg_master_password
    ports:
      - "5432:5432"
    volumes:
      - xg_master_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xg_master -d xg_master_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://xg_master:xg_master_password@db:5432/xg_master_bot
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      DATA_PROVIDER: ${DATA_PROVIDER:-open}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "xG_Master_Bot"]

volumes:
  xg_master_pgdata:
